      <div>
        <div class="hdr-eyebrow">Looksmax Mission Control</div>

      <button class="data-close" onclick="closeDataModal()">Close</button>

  </div>
  <div class="tabs" id="tabs"></div>

</div>

    if(!raw) return;

    if(d.tab) S.tab=d.tab;
    if(d.injStart) S.injStart=d.injStart;

function isNthDay(startDateStr,n){
  if(!startDateStr) return false;
  const parts=startDateStr.split('-').map(Number);
  const start=new Date(parts[0],parts[1]-1,parts[2]);
  const today=new Date();
  start.setHours(0,0,0,0);today.setHours(0,0,0,0);
  const diff=Math.round((today-start)/86400000);
  return diff>=0&&diff%n===0;
}

function daysUntilNext(startDateStr,n){
  if(!startDateStr) return null;
  const parts=startDateStr.split('-').map(Number);
  const start=new Date(parts[0],parts[1]-1,parts[2]);
  const today=new Date();
  start.setHours(0,0,0,0);today.setHours(0,0,0,0);
  const diff=Math.round((today-start)/86400000);
  if(diff<0) return Math.abs(diff);
  const rem=diff%n;return rem===0?0:n-rem;
}

function renderInjectionSchedule(){
  const wrap=el('div');
  wrap.style.cssText='margin:10px 16px 4px;background:#0E0E14;border-radius:12px;overflow:hidden;border:1px solid #1C1C24';
  const hd=el('div');
  hd.style.cssText='padding:9px 14px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#5A5A68;border-bottom:1px solid #1A1A20';
  hd.textContent='Injection Schedule';
  wrap.appendChild(hd);
  const activeCompounds=INJ_COMPOUNDS.filter(c=>compoundActive(c.key));
  if(!activeCompounds.length) return wrap;
  activeCompounds.forEach(c=>{
    const row=el('div');
    row.style.cssText='display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #111116;gap:10px';
    const dot=el('div');
    dot.style.cssText=`width:6px;height:6px;border-radius:50%;background:${c.color};flex-shrink:0`;
    row.appendChild(dot);
    const lbl=el('div');lbl.style.flex='1';
    lbl.innerHTML=`<div style="font-size:12px;color:#EFEFEF">${c.label}</div><div style="font-size:10px;color:#3A3A48;margin-top:1px">${c.dose} · every ${c.every} days</div>`;
    row.appendChild(lbl);
    const startDate=S.injStart[c.key];
    const d=daysUntilNext(startDate,c.every);
    if(!startDate){
      const btn=el('button');
      btn.style.cssText='padding:5px 10px;background:#111118;border:1px solid #282836;border-radius:8px;color:#5B9FC8;font-size:10px;cursor:pointer;white-space:nowrap';
      btn.textContent='Set start date';
      btn.onclick=()=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
        const inp=document.createElement('input');inp.type='date';
        const now=new Date();
        inp.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
        inp.style.cssText='background:#111116;border:1px solid #4A9EFF;border-radius:8px;padding:5px 8px;color:#EFEFEF;font-size:11px;width:130px';
        const conf=document.createElement('button');
        conf.textContent='Save';
        conf.style.cssText='padding:5px 10px;background:#4A7A50;border:none;border-radius:8px;color:#fff;font-size:11px;cursor:pointer';
        conf.onclick=()=>{if(inp.value){S.injStart[c.key]=inp.value;save();renderContent();}};
        wrap.appendChild(inp);wrap.appendChild(conf);
        btn.replaceWith(wrap);inp.focus();
      };
      row.appendChild(btn);
    } else {
      const status=el('div');status.style.cssText='display:flex;align-items:center;gap:8px';
      const badge=el('div');
      badge.style.cssText=`padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;background:${d===0?'rgba(200,150,60,0.15)':'#111118'};color:${d===0?'#4A9EFF':'#3A3A48'};border:1px solid ${d===0?'rgba(200,150,60,0.3)':'#1C1C24'}`;
      badge.textContent=d===0?'Today ✓':`In ${d}d`;
      const reset=el('button');
      reset.style.cssText='padding:3px 7px;background:none;border:1px solid #1C1C24;border-radius:6px;color:#3A3A48;font-size:9px;cursor:pointer';
      reset.textContent='↺';
      reset.onclick=()=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;align-items:center;gap:6px';
        const inp=document.createElement('input');inp.type='date';
        inp.value=S.injStart[c.key]||'';
        inp.style.cssText='background:#111116;border:1px solid #4A9EFF;border-radius:8px;padding:5px 8px;color:#EFEFEF;font-size:11px;width:120px';
        const conf=document.createElement('button');
        conf.textContent='Save';
        conf.style.cssText='padding:5px 8px;background:#4A7A50;border:none;border-radius:8px;color:#fff;font-size:11px;cursor:pointer';
        conf.onclick=()=>{if(inp.value){S.injStart[c.key]=inp.value;save();renderContent();}};
        wrap.appendChild(inp);wrap.appendChild(conf);
        reset.replaceWith(wrap);inp.focus();
      };
      status.appendChild(badge);status.appendChild(reset);row.appendChild(status);
    }
    wrap.appendChild(row);
  });
  return wrap;
}

function itemVisible(item){
  if(item.showOnDays&&!item.showOnDays.includes(TODAY_DOW)) return false;
  if(item.showIf&&!Object.values(S.choices).includes(item.showIf)) return false;
  if(item.showIfDayType&&!item.showIfDayType.includes(S.dayType)) return false;
  if(item.compoundKey&&!compoundActive(item.compoundKey)) return false;
  if(item.showEveryNDays&&item.startKey){
    if(!S.injStart[item.startKey]) return true;
    return isNthDay(S.injStart[item.startKey],item.showEveryNDays);
  }
  return true;
}

function allCheckable(arr){
  const out=[];
  arr.forEach(i=>{
    if(i.type==='group'){
      if(!itemVisible(i)) return;
      i.children.forEach(c=>{
        if(!c.type&&itemVisible(c)) out.push(c);
      });
    }
    else if(i.type==='choice') out.push(i);
    else if(!i.type&&itemVisible(i)) out.push(i);
  });
  return out;
}

function makeCollapsSection(secId,title,color,items){
  const isOpen=S.sections[secId]!==false;
  const ck=allCheckable(items);
  const done=ck.filter(i=>{
    if(i.type==='choice') return !!S.choices[i.id];
    return !!S.checked[i.id];
  }).length;
  const wrap=el('div');
  const hd=el('div','csec-hd');
  hd.innerHTML=`<div class="sec-left"><div class="sec-dot" style="background:${color}"></div><span class="sec-lbl" style="color:${color}">${title}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="sec-ct">${done}/${ck.length}</span><span style="color:#2E2E38">${chevSVG(!isOpen)}</span></div>`;
  hd.onclick=()=>{S.sections[secId]=!isOpen;save();renderContent();};
  wrap.appendChild(hd);
  if(isOpen){
    items.forEach(item=>{
      if(item.type==='header') wrap.appendChild(makeGrpHd(item.text));
      else if(!itemVisible(item)) return;
      else if(item.type==='group') wrap.appendChild(makeGroup(item));
      else if(item.type==='choice') wrap.appendChild(makeChoice(item));
      else wrap.appendChild(makeCheckRow(item));
    });
  }
  return wrap;
}

function makeGrpHd(text){
  return el('div','grp-hd',`<div class="grp-line"></div><span class="grp-txt">${text}</span><div class="grp-line"></div>`);
}

function makeCheckRow(item){
  const checked=!!S.checked[item.id];
  const expanded=!!S.expanded[item.id];
  const row=el('div','crow'+(checked?' done':''));
  row.id='R'+item.id;
  const inner=el('div','crow-in');

  const box=el('div','cbox'+(checked?' on':''));
  box.id='B'+item.id;
  if(checked) box.innerHTML=chkSVG();
  box.onclick=()=>doCheck(item.id);

  const body=el('div','cbody');
  body.onclick=()=>doExpand(item.id);
  const tr=el('div','ctxt-row');
  const tx=el('span','ctxt',item.text);
  tx.id='T'+item.id;
  tr.appendChild(tx);
  if(item.tag) tr.appendChild(tagEl(item.tag));
  body.appendChild(tr);
  if(expanded&&item.note){
    const n=el('div','cnote',item.note);
    body.appendChild(n);
  }

  const ch=el('button','chev',chevSVG(expanded));
  ch.onclick=()=>doExpand(item.id);

  inner.appendChild(box);
  inner.appendChild(body);
  if(item.note) inner.appendChild(ch);
  row.appendChild(inner);
  return row;
}

function makeGroup(item){
  const children=item.children||[];
  const checkable=children.filter(c=>!c.type);
  const done=checkable.filter(c=>S.checked[c.id]).length;
  const full=done===checkable.length&&checkable.length>0;
  const isExp=!!S.expanded[item.id];
  const wrap=el('div');

  const par=el('div','grp-parent');
  const inner=el('div','crow-in');
  const body=el('div','cbody');
  body.onclick=()=>doExpand(item.id);
  const tr=el('div','ctxt-row');
  const tx=el('span','ctxt',item.text);
  tx.style.fontWeight='600';
  tr.appendChild(tx);
  if(item.tag) tr.appendChild(tagEl(item.tag));
  const badge=el('span','grp-badge'+(full?' full':''),`${done}/${checkable.length}`);
  tr.appendChild(badge);
  body.appendChild(tr);
  const ch=el('button','chev',chevSVG(isExp));
  ch.onclick=()=>doExpand(item.id);
  inner.appendChild(body);
  inner.appendChild(ch);
  par.appendChild(inner);
  wrap.appendChild(par);

  if(isExp){
    const cw=el('div','grp-children');
    if(item.groupNote){
      const gn=el('div','cnote',item.groupNote);
      gn.style.cssText='padding:8px 12px 4px;border-bottom:1px solid #131318;font-size:11px;color:#5A5A68';
      cw.appendChild(gn);
    }
    children.forEach(child=>{
      if(child.type==='header'){
        const sh=el('div');
        sh.style.cssText='padding:7px 12px 3px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A3A48;border-top:1px solid #131318;margin-top:2px';
        sh.textContent=child.text;
        cw.appendChild(sh);
      } else if(itemVisible(child)) cw.appendChild(makeCheckRow(child));
    });
    wrap.appendChild(cw);
  }
  return wrap;
}

function makeChoice(item){
  const sel=S.choices[item.id];
  const wrap=el('div','choice-row');
  const inner=el('div','choice-in');
  const lbl=el('div','choice-lbl',item.text);
  inner.appendChild(lbl);
  const opts=el('div','choice-opts');
  const visibleOpts = item.opts.filter(o => {
    if(o.hideIfChoiceActive && Object.values(S.choices).includes(o.hideIfChoiceActive)) return false;
    return true;
  });
  visibleOpts.forEach(opt=>{
    const btn=el('button','choice-btn'+(sel===opt.id?' sel':''),opt.label);
    btn.onclick=()=>{
      const newSel=sel===opt.id?null:opt.id;
      S.choices[item.id]=newSel;
      S.checked[item.id]=!!newSel;
      save();
      renderContent();
    };
    opts.appendChild(btn);
  });
  inner.appendChild(opts);
  if(sel){
    const selOpt=item.opts.find(o=>o.id===sel);
    if(selOpt&&selOpt.note){
      const note=el('div','choice-extra');
      note.innerHTML=`<span style="font-size:11px;color:#5A5A68">${selOpt.note}</span>`;
      inner.appendChild(note);
    }
  }
  wrap.appendChild(inner);
  return wrap;
}

function updateProgress(){
  const base=[...MORNING,...MIDDAY,...EVENING];
  if(S.dayType==='lift'||S.dayType==='both') base.push(...LIFT);
  if(S.dayType==='swim'||S.dayType==='both') base.push(...SWIM);
  const all=allCheckable(base);
  const done=all.filter(i=>{
    if(i.type==='choice') return !!S.choices[i.id];
    return !!S.checked[i.id];
  }).length;
  const pct=all.length>0?Math.round(done/all.length*100):0;
  const color=pct===100?'#5B9F6A':'#4A9EFF';
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pct').style.color=color;
  document.getElementById('sub').textContent=`${done}/${all.length} done`;
  const f=document.getElementById('fill');
  f.style.width=pct+'%';
  f.style.background=color;
}

    what:'Repositions both upper jaw (Le Fort I) and lower jaw (BSSO) to correct jaw retrusion and bite relationship at the skeletal level. Addresses profile, jaw projection, facial balance, and reduces sleep apnea and TMJ risk long term.',
    notes:'Major surgery — 6-12 week recovery. Requires OMFS consult and orthodontic coordination. Typically staged after Invisalign establishes dental alignment. Full hEDS disclosure mandatory — affects bone healing, remodeling, and retention. Significant profile transformation.',
    timing:'Post-Invisalign completion. Consider SARPE first to establish palatal width.'},
  {id:'fatgraft',name:'Periorbital Fat Grafting',sub:'Sub-brow Fat Transfer',color:'#6ABCBC',
    what:'Transfers fat from a donor site to the sub-brow and periorbital area creating volume, heaviness, and the deep-set hooded appearance associated with hunter eyes. More permanent than filler with natural feel.',
    notes:'HA filler available as a reversible lower-commitment test before committing to fat grafting. Variable fat retention — some resorption expected and may need touch-up. EDS may affect fat survival and tissue response. Seek surgeon experienced specifically in periorbital fat grafting.',
    timing:'Test with HA sub-brow filler first to preview result before committing to fat grafting.'},
  {id:'cantho',name:'Lateral Canthopexy / Canthoplasty',sub:'Outer Canthal Repositioning — Upward',color:'#A98FE0',
    what:'Repositions or supports the outer corner of the eye upward, creating the outer-higher-than-inner diagonal that defines the hunter eye appearance. Canthopexy is less invasive (supports without cutting tendon). Canthoplasty is more involved. Goal is upward tilt from neutral baseline.',
    notes:'You are already roughly neutral — a subtle upward repositioning is the target, not downturned. Evaluate after periorbital fat grafting results since volume change affects how canthal position reads. Seek oculoplastic surgeon with specific canthoplasty experience. Irreversible — approach carefully.',
    timing:'After periorbital fat grafting results are fully established.'},
  {id:'liplift',name:'Subnasal Lip Lift',sub:'Bullhorn Lip Lift',color:'#D4A84A',
    what:'Shortens the philtrum (distance between nose and upper lip) by removing a small strip of skin under the nose. Increases upper lip tooth show at rest, creates the slightly elevated upper lip curl that reads as confident and masculine. No added volume — purely structural.',
    notes:'One of the most naturally masculine lip procedures available. Conservative technique is key — over-resection creates an unnatural appearance. Seek surgeon with specific lip lift experience and a portfolio of male patients. Scar sits in the natural crease under the nose and becomes nearly invisible.',
    timing:'Standalone — no prerequisite procedures.'},
  {id:'cornerlift',name:'Corner of Mouth Lift',sub:'Commissuroplasty',color:'#4A9EFF',
    what:'Small incisions at the corners of the mouth lift a neutral or downturned resting expression upward, creating the subtle natural slight smirk at rest. Reads as confident and sharp rather than done. No volume added.',
    notes:'Technique-sensitive — conservative lift is undetectable, over-correction looks surgical. Often combined with lip lift for cohesive result. Complements the aesthetic goal of a naturally confident resting expression.',
    timing:'Can be done alongside or after lip lift.'},
];

function renderHardmax(){
  const f=document.createDocumentFragment();
  const hd=el('div');
  hd.style.cssText='padding:16px 16px 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#5A5A68';
  hd.textContent='Theoretical Procedure Reference';
  f.appendChild(hd);
  const statuses=[['theoretical','Theoretical'],['considering','Considering'],['planned','Planned']];
  const statusColors={theoretical:'#3A3A48',considering:'#4A9EFF',planned:'#4A7A50'};
  PROCEDURES.forEach(p=>{
    const cur=S.procStatus[p.id]||'theoretical';
    const card=el('div','proc-card');
    const hd2=el('div','proc-hd');
    hd2.style.borderLeft=`3px solid ${p.color}`;
    hd2.innerHTML=`<div class="proc-name">${p.name}</div><div class="proc-sub" style="color:${p.color}">${p.sub}</div>`;
    card.appendChild(hd2);
    const body=el('div','proc-body');
    body.innerHTML=`<div class="proc-lbl">What it does</div><div class="proc-txt">${p.what}</div><div class="proc-lbl">Notes</div><div class="proc-txt">${p.notes}</div><div class="proc-lbl">Timing</div><div class="proc-timing">${p.timing}</div>`;
    card.appendChild(body);
    const statusRow=el('div','proc-status');
    statuses.forEach(([val,lbl])=>{
      const on=cur===val;
      const btn=el('button','proc-sbtn'+(on?' on':''),lbl);
      if(on){btn.style.background=statusColors[val];btn.style.borderColor=statusColors[val];}
      btn.onclick=()=>{S.procStatus[p.id]=val;save();renderContent();};
      statusRow.appendChild(btn);
    });
    card.appendChild(statusRow);
    f.appendChild(card);
  });
  const pad=el('div');pad.style.height='24px';f.appendChild(pad);
  return f;
}



function renderTabs(){
  const bar=document.getElementById('tabs');
  bar.innerHTML='';
  TABS.forEach(([id,lbl])=>{
    const b=el('button','tab'+(S.tab===id?' on':''),lbl);
    b.onclick=()=>{S.tab=id;save();renderTabs();renderContent();};
    bar.appendChild(b);
  });
}

// ── RENDER CONTENT ────────────────────────────────────────────────────────────

function renderContent(){
  const c=document.getElementById('content');
  c.innerHTML='';
  const f=document.createDocumentFragment();

  // Show import reminder if no saved data exists
  const hasData=!!localStorage.getItem('lmx3');
  if(!hasData){
    const banner=el('div');
    banner.style.cssText='margin:10px 16px;background:rgba(200,150,60,0.12);border:1px solid rgba(200,150,60,0.3);border-radius:10px;padding:10px 14px;font-size:11px;color:#4A9EFF;cursor:pointer';
    banner.innerHTML='⚙ Have a previous version? <strong>Tap here to import your data</strong> — start dates, TRT log, and settings all transfer.';
    banner.onclick=()=>openDataModal();
    f.appendChild(banner);
  }

  if(S.tab==='daily'){
    f.appendChild(renderDaySelector());
    // Only show injection schedule on injection days
    const hasTodayInjection=INJ_COMPOUNDS.filter(c=>compoundActive(c.key)).some(c=>{
      const startDate=S.injStart[c.key];
      if(!startDate) return false;
      return isNthDay(startDate,c.every);
    });
    if(hasTodayInjection) f.appendChild(renderInjectionSchedule());

    const liftMorning=(S.dayType==='lift'||S.dayType==='both')&&(S.liftTime||'midday')==='morning';
    const swimMorning=(S.dayType==='swim'||S.dayType==='both')&&(S.swimTime||'evening')==='morning';
    const workoutInMorning=liftMorning||swimMorning;

    const sections=[];

    if(workoutInMorning){
      const splitIdx=MORNING.findIndex(i=>i.id==='am_shower');
      const mPre=splitIdx>-1?MORNING.slice(0,splitIdx):MORNING;
      const mPost=splitIdx>-1?MORNING.slice(splitIdx):[];
      sections.push({id:'morning',label:'Morning',color:'#4A9EFF',items:mPre,priority:0});
      if(mPost.length) sections.push({id:'morning_post',label:'Skincare & Oral',color:'#4A9EFF',items:mPost,priority:8});
    } else {
      sections.push({id:'morning',label:'Morning',color:'#4A9EFF',items:MORNING,priority:0});
    }

    sections.push({id:'midday',label:'Midday',color:'#5B9FC8',items:MIDDAY,priority:20});
    sections.push({id:'evening',label:'Evening',color:'#9B7FD4',items:EVENING,priority:30});

    if(S.dayType==='lift'||S.dayType==='both'){
      const lt=S.liftTime||'midday';
      sections.push({id:'lift',label:'Lift Session',color:'#88C870',items:LIFT,
        priority:lt==='morning'?5:lt==='midday'?25:28});
    }
    if(S.dayType==='swim'||S.dayType==='both'){
      const st=S.swimTime||'evening';
      sections.push({id:'swim',label:'Swim Session',color:'#6ABCBC',items:SWIM,
        priority:st==='morning'?6:st==='midday'?26:28});
    }

    sections.sort((a,b)=>a.priority-b.priority);
    sections.forEach(s=>f.appendChild(makeCollapsSection(s.id,s.label,s.color,s.items)));
  }
  else if(S.tab==='hardmax'){
    f.appendChild(renderHardmax());
  }
  else if(S.tab==='meals'){
    const w=el('div','g-wrap');
    function mslbl(color,text){
      const d=el('div','g-slbl');
      d.innerHTML=`<div class="g-sdot" style="background:${color}"></div><span class="g-stxt" style="color:${color}">${text}</span>`;
      return d;
    }
    function mcard(cat,items){
      const c=el('div','st-card');
      c.innerHTML=`<div class="st-cat">${cat}</div><div class="st-items">${items}</div>`;
      return c;
    }

    // BREAKFAST
    w.appendChild(mslbl('#4A9EFF','Breakfast — Build Your Plate'));
    w.appendChild(mcard('Protein — pick 1 or 2','Microwave bacon (2 slices = 7g) · Scrambled eggs · Yoplait yogurt peach · Skim milk (drink alongside)'));
    w.appendChild(mcard('Grains — pick 1','Quaker protein oatmeal + skim milk (12g/serving) · Special K cereal · Kind Protein Granola'));
    w.appendChild(mcard('Fruit — add as much as you want','Blackberries · Blueberries · Raspberries · Grapes · Banana'));
    w.appendChild(mcard('Note','Oatmeal + bacon + fruit is the protein-highest easy combo. Cereal or granola days are lower protein — add yogurt or extra bacon to compensate.'));

    // SMOOTHIE
    w.appendChild(mslbl('#5B9FC8','Midday Smoothie'));
    w.appendChild(mcard('Food ingredients','Skim milk · Greek yogurt · Frozen mango · Banana · PB2 (peanut butter powder) · Chia seeds · Spinach · Ice · Pinch of salt'));
    w.appendChild(mcard('Supplement adds (blend in)','Protein powder 1 scoop (30g) · Creatine 5g · Collagen + Probiotics 1 scoop · Beta Alanine 4g · L-Citrulline 6g'));
    w.appendChild(mcard('Timing tip','On swim days, drink ~90 min before practice — citrulline works best as a pre-workout at that window.'));

    // SNACKS
    w.appendChild(mslbl('#D4A84A','Snacks'));
    w.appendChild(mcard('Protein snacks','Kind Protein Bars · Premier Protein chocolate milk (have almost daily) · Kind Protein Granola'));
    w.appendChild(mcard('Lighter snacks','Veggie straws · Skinny Pop popcorn · Low fat wheat thins · Pretzels / pretzel sticks'));
    w.appendChild(mcard('Fruit','Blackberries · Blueberries · Raspberries · Grapes · Banana'));

    // DINNER - EATING IN
    w.appendChild(mslbl('#9B7FD4','Dinner — Eating In'));
    w.appendChild(mcard('Protein — microwave or air fry, pick 1','Turkey hot dogs · Chicken nuggets · Corn dogs · Popcorn shrimp · Air fryer chicken'));
    w.appendChild(mcard('Add a side','Fruit · Veggie straws · Skinny Pop · Wheat thins · Pretzels'));

    // DINNER - TAKEOUT
    w.appendChild(mslbl('#A98FE0','Dinner — Takeout'));
    w.appendChild(mcard('Local Chinese (best)','Sweet & sour chicken + shrimp fried rice'));
    w.appendChild(mcard('Panda Express','Orange Chicken double plate + mixed veg + rice'));
    w.appendChild(mcard('MOD Pizza','Pepperoni + sausage + bacon, light cheese'));
    w.appendChild(mcard('Five Guys (infrequent)','Bacon burgers'));

    const pad=el('div');pad.style.height='24px';w.appendChild(pad);
    f.appendChild(w);
  }
  else if(S.tab==='stack'){
    const w=el('div','stk-wrap');
    f.appendChild(renderRecon());
    f.appendChild(renderCompoundToggles());
    f.appendChild(renderTRTTracker());
    f.appendChild(renderInjectionSchedule());
    const pad=el('div');pad.style.height='12px';f.appendChild(pad);
    STACK.forEach(sec=>{
      const s=el('div','stk-sec');
      const hd=el('div','sec-hd');
      hd.style.padding='0 0 8px';
      hd.innerHTML=`<div class="sec-left"><div class="sec-dot" style="background:${sec.color}"></div><span class="sec-lbl" style="color:${sec.color}">${sec.label}</span></div>`;
      s.appendChild(hd);
      const tbl=el('div','stk-tbl');
      sec.rows.forEach(([name,dose,timing,type,desc])=>{
        const r=el('div','stk-row');
        r.style.alignItems='flex-start';
        r.innerHTML=`<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><span class="stk-name">${name}</span><span class="stk-type">${type}</span></div>${desc?`<div style="font-size:10px;color:#5A5A68;margin-top:3px;line-height:1.45">${desc}</div>`:''}</div><div class="stk-r" style="flex-shrink:0;padding-left:8px"><div class="stk-dose" style="color:${sec.color}">${dose}</div><div class="stk-timing">${timing}</div></div>`;
        tbl.appendChild(r);
      });
      s.appendChild(tbl);
      w.appendChild(s);
    });
    f.appendChild(w);
  }
  c.appendChild(f);
  updateProgress();
}

// ── INIT ──────────────────────────────────────────────────────────────────────

function openDataModal(){
  const raw=localStorage.getItem('lmx3')||'{}';
  document.getElementById('export-ta').value=raw;
  document.getElementById('import-ta').value='';
  document.getElementById('data-modal').style.display='flex';
}
function closeDataModal(){
  document.getElementById('data-modal').style.display='none';
}
function doExport(){
  const ta=document.getElementById('export-ta');
  ta.select();
  try{
    navigator.clipboard.writeText(ta.value).then(()=>{
      ta.value='✓ Copied! Paste this into the new file\'s Import box.';
      setTimeout(()=>{ta.value=localStorage.getItem('lmx3')||'{}';},2500);
    });
  }catch(e){
    document.execCommand('copy');
  }
}
function doImport(){
  const val=document.getElementById('import-ta').value.trim();
  if(!val){alert('Paste your exported data first.');return;}
  try{
    JSON.parse(val); // validate
    localStorage.setItem('lmx3',val);
    load();
    renderTabs();
    renderContent();
    closeDataModal();
  }catch(e){
    alert('Invalid data — make sure you copied the full export string.');
  }
}

load();
try {
  renderTabs();
  renderContent();
} catch(e) {
  document.getElementById('content').innerHTML = '<div style="padding:20px;color:#ff6b6b;font-family:monospace;font-size:12px;white-space:pre-wrap">ERROR: ' + e.message + '\n\n' + e.stack + '</div>';
}
</script>
